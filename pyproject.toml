[project]
name = "ai-compiler-lab"
version = "0.1.0"
description = "Apple Silicon inference and AI compiler learning labs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "coremltools==9.0",
    "ipykernel>=6.29",
    "jupyterlab>=4.3",
    "matplotlib>=3.9",
    "nbclient>=0.10",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "netron>=8.0",
    "numpy>=1.26,<2",
    "onnx>=1.17",
    "onnxruntime>=1.21",
    "onnxscript>=0.3",
    "pandas>=2.2",
    "pillow>=11",
    "torch==2.7.0",
    "torchvision==0.22.0",
]

[tool.uv]
package = false
